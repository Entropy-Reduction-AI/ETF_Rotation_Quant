# D38 第 46 行：候选去重的行业标签（跑前登记，2026-11-20，运行前写定）
# 规则：前 N 选人时，同一标签只留分数最高的一个，空位由下一名递补；没有标签的候选（宽基、母指数）不去重。
# 标签取指数公司的一级行业：美股按 GICS，A 股按中证一级（金融地产仍按旧口径合为一类，与中证全指一级行业一致）。
# 主题指数没有官方一级行业，按其成份所属的主要一级行业标注（人工智能 → 信息技术，机器人、军工 → 工业，农业、酒 → 主要消费）。
# 红利类是策略指数，不属于任何行业，但三只是同一个押注，单列“红利”标签。
# SP5NENRS 是净总回报口径，与其余价格指数不可比，本行不参选（且与 XLE 重复）。

